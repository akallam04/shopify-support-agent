name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit, policy, contract, and offline graph tests
        run: python -m pytest -q
      - name: Task validation and gold replay
        run: |
          python -m evals.sim.validate_tasks
          python -m evals.sim.validate_tasks --task-file evals/sim/heldout_tasks.json
          python -m evals.sim.validate_tasks --task-file evals/sim/hardening_tasks.json

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Install the headless browser
        run: python -m playwright install --with-deps chromium-headless-shell
      - name: Browser tests on recorded replies
        run: python -m pytest -q tests/e2e
      - name: UI audit at seven screen sizes
        run: python -m scripts.ui_audit --out audit-screenshots --fail
      - name: Keep the audit screenshots when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: audit-screenshots/
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan history
        run: ./gitleaks git --redact --no-banner .
