name: Keep warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping the health check, which makes no model call
        run: curl -sS --max-time 60 -o /dev/null -w "health %{http_code} in %{time_total}s\n" https://8e0p0ih798.execute-api.us-east-1.amazonaws.com/health
