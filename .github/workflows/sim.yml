name: Simulation run

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: Task set
        type: choice
        options:
          - evals/sim/tasks.json
          - evals/sim/hardening_tasks.json
          - evals/sim/heldout_tasks.json
        default: evals/sim/tasks.json
      tasks:
        description: Comma-separated task ids, empty for the whole set
        default: ""
      k:
        description: Tries per task
        default: "1"
      max_usd:
        description: Spend cap in USD
        default: "0.50"
      approved_over_1:
        description: Required for a cap above 1 USD
        type: boolean
        default: false

permissions:
  contents: read

env:
  TASK_FILE: ${{ inputs.task_file }}
  TASKS: ${{ inputs.tasks }}
  K: ${{ inputs.k }}
  MAX_USD: ${{ inputs.max_usd }}
  APPROVED_OVER_1: ${{ inputs.approved_over_1 }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Show the plan and the cost estimate
        run: |
          set -o pipefail
          args=(--label ci-sim --task-file "$TASK_FILE" --k "$K" --max-usd "$MAX_USD" --estimate-only)
          if [ -n "$TASKS" ]; then args+=(--tasks "$TASKS"); fi
          if [ "$APPROVED_OVER_1" = "true" ]; then args+=(--approved-over-1); fi
          python -m evals.sim.run_sim "${args[@]}" | tee plan.txt
          { echo '### Simulation plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: paid-runs
    env:
      ANTHROPIC_API_KEY: ${{ secrets.CI_ANTHROPIC_API_KEY }}
      SIM_USER_API_KEY: ${{ secrets.CI_SIM_USER_API_KEY }}
      SIM_USER_BASE_URL: ${{ secrets.CI_SIM_USER_BASE_URL }}
      SIM_USER_MODEL: ${{ secrets.CI_SIM_USER_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Build the knowledge index
        run: python -m app.rag.index
      - name: Run the simulation
        run: |
          args=(--label ci-sim --task-file "$TASK_FILE" --k "$K" --max-usd "$MAX_USD")
          if [ -n "$TASKS" ]; then args+=(--tasks "$TASKS"); fi
          if [ "$APPROVED_OVER_1" = "true" ]; then args+=(--approved-over-1); fi
          python -m evals.sim.run_sim "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sim-results
          path: evals/results/sim/*_ci-sim/
